[project]
name = "qenc"
version = "1.0.0"
description = "Reproduction code for 'How Quantum Data Encoding Constrains Representation Learning'"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
# The versions that produced the archived results.
dependencies = [
    "matplotlib==3.11.0",
    "numpy==2.4.6",
    "pandas==2.3.3",
    "pennylane==0.45.0",
    "scikit-learn==1.9.0",
    "scipy==1.18.0",
    "torch==2.12.1",
    "wfdb==4.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qenc"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# dict(...) rows read better than literals here, every closure that B023 flags runs within its own loop
# iteration, and int(round(...)) stays explicit about the index type.
ignore = ["B023", "C408", "RUF046"]
